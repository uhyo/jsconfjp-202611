# Builds the slides and publishes them to GitHub Pages
# (https://uhyo.github.io/jsconfjp-202611/).
#
# One-time setup in the repository settings:
# - Pages → Build and deployment → Source: "GitHub Actions".
# - Secrets and variables → Actions → Variables: INGENUI_DEMO_URL = the
#   deployed ingenui demo server (https://ingenui-demo.<account>.workers.dev),
#   for <ClaudeChatDemo>. That server must list https://uhyo.github.io in its
#   ALLOWED_ORIGINS (it does by default).
name: Deploy slides to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
        env:
          INGENUI_DEMO_URL: ${{ vars.INGENUI_DEMO_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
